name: Controlled production deployment

# verify → staging → acceptance → production → release → verify production.
# `validation_only` stops after the staging acceptance and works from any branch.
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Deploy and accept on staging only, without touching production
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the approved source
    uses: ./.github/workflows/quality-gate.yml

  staging:
    name: Staging worker
    needs: verify
    uses: ./.github/workflows/worker-deploy.yml
    with:
      environment: staging
    secrets: inherit

  acceptance:
    name: Accept on staging
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
      REPORTER_ACCEPTANCE_TARGET: ${{ vars.REPORTER_ACCEPTANCE_TARGET }}
      REPORTER_APP_ORIGINS: ${{ vars.REPORTER_APP_ORIGINS }}
      REPORTER_WORKER_PASSWORD: ${{ secrets.REPORTER_WORKER_PASSWORD }}
      REPORTER_RUNTIME_PASSWORD: ${{ secrets.REPORTER_RUNTIME_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_AI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Keep Neon identifiers out of the logs
        run: |
          for value in "$NEON_PROJECT_ID" "$NEON_BRANCH_ID"; do
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done

      - name: Check out the release source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the speech generator and the Neon CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          npm install --global --no-audit --no-fund neon@6.3.0

      # A 20-second synthetic upload through storage and Groq, one generated article and
      # its approval by a second user, against the worker the staging stage just deployed.
      - name: Run the staging acceptance
        run: node scripts/neon-acceptance.mjs

  production:
    name: Production worker
    if: ${{ !inputs.validation_only && github.ref == 'refs/heads/main' }}
    needs: acceptance
    uses: ./.github/workflows/worker-deploy.yml
    with:
      environment: production
    secrets: inherit

  release:
    name: Publish the release
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate version and release descriptions
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: pnpm release:prepare:auto

      - name: Validate prepared release
        run: pnpm gate

      - name: Commit and tag release
        id: commit
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ACTOR_LOGIN: ${{ github.actor }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "$ACTOR_LOGIN"
          git config user.email "$ACTOR_ID+$ACTOR_LOGIN@users.noreply.github.com"
          git add package.json CHANGELOG.md src/data/release-history.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Reporter IA $TAG"
          # The workflow already ran pnpm gate; allow this controlled release push past the local main guard.
          git -c core.hooksPath=/dev/null push origin HEAD:main "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: gh release create "$TAG" --verify-tag --title "Reporter IA $TAG" --notes-file "$RELEASE_NOTES_PATH"

  verify-production:
    name: Verify production
    needs: [production, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job installs no pnpm; v5 would otherwise cache the package manager named in package.json.
          package-manager-cache: false

      # The Vercel Git integration builds the release commit; production passes only when it
      # serves that version and commit, with every setting present and the new worker wired.
      - name: Wait for Vercel to serve the release
        env:
          REPORTER_APP_URL: ${{ vars.REPORTER_APP_URL }}
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ needs.release.outputs.commit }}
          WORKER: ${{ needs.production.outputs.worker_fingerprint }}
        run: |
          set -euo pipefail
          if [[ -z "${REPORTER_APP_URL:-}" ]]; then
            echo "::error::Set REPORTER_APP_URL on the production GitHub environment."
            exit 1
          fi
          node scripts/check-app-health.mjs --url "$REPORTER_APP_URL" --version "$VERSION" --commit "$COMMIT" --worker-fingerprint "$WORKER" --attempts 90
          {
            echo "### Reporter IA v$VERSION is live"
            echo "Vercel serves the release commit with every setting present and the newly deployed worker."
            echo "Local Vercel users, tokens and CLI deployment are prohibited."
          } >> "$GITHUB_STEP_SUMMARY"
