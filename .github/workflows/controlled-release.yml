name: Controlled production deployment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release configuration and provider credentials
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          REPORTER_WORKER_PASSWORD: ${{ secrets.REPORTER_WORKER_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/check-release-services.mjs

      - name: Validate approved source
        run: pnpm gate

      - name: Calculate version and release descriptions
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: pnpm release:prepare:auto

      - name: Validate prepared release
        run: pnpm gate

      - name: Install Neon CLI
        run: npm install --global --no-audit --no-fund neon@6.3.0

      - name: Migrate Neon and deploy the worker
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          REPORTER_WORKER_PASSWORD: ${{ secrets.REPORTER_WORKER_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_BRANCH_ID REPORTER_WORKER_PASSWORD GROQ_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY PIXABAY_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name in the production GitHub environment."
              exit 1
            fi
          done

          umask 077
          env_file="$RUNNER_TEMP/reporter-neon-release.env"
          trap 'rm -f "$env_file"' EXIT

          # Resolve the target branch's owner connection in memory. It feeds the
          # idempotent SQL migrations and the worker connection URL in neon.ts.
          database_url="$(neon connection-string "$NEON_BRANCH_ID" --project-id "$NEON_PROJECT_ID" --role-name neondb_owner)"
          if [[ -z "$database_url" ]]; then
            echo "::error::Neon did not return a connection string for the configured production branch."
            exit 1
          fi
          export DATABASE_URL="$database_url"
          export DATABASE_URL_UNPOOLED="$database_url"

          neon env pull --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --service postgres --file "$env_file"
          node --input-type=module - "$env_file" <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const file = process.argv[2];
          const names = ['REPORTER_WORKER_PASSWORD', 'GROQ_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'PIXABAY_API_KEY'];
          const lines = names.map(name => `${name}=${JSON.stringify(process.env[name])}`);
          await appendFile(file, `\n${lines.join('\n')}\n`, { mode: 0o600 });
          NODE

          node --env-file="$env_file" scripts/reporter-cloud.mjs migrate
          neon deploy --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --env "$env_file" --allow-protected --no-env-pull

          # Pull the newly deployed function URL into the temporary env file and
          # prove the worker can authenticate to Postgres and register a heartbeat.
          neon env pull --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH_ID" --file "$env_file"
          node --env-file="$env_file" scripts/provision-worker-media.mjs
          node --env-file="$env_file" --input-type=module <<'NODE'
          const endpoint = process.env.NEON_FUNCTION_REPORTERWORKER_BASE_URL;
          const secret = process.env.REPORTER_WORKER_PASSWORD;
          if (!endpoint || !secret) throw new Error('Neon worker health check is missing its function URL or password.');
          let ready = false;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(endpoint, {
                headers: { 'x-reporter-worker-key': secret },
                signal: AbortSignal.timeout(120_000),
              });
              const payload = await response.json();
              if (response.ok && payload.ok === true) { ready = true; break; }
              const code = typeof payload.error === 'string' && /^[A-Z0-9_]{1,64}$/.test(payload.error)
                ? payload.error : `HTTP_${response.status}`;
              console.warn(`Neon worker readiness attempt ${attempt + 1}: ${code}`);
            } catch { /* Retry a cold function without printing secret-bearing URLs. */ }
          }
          if (!ready) throw new Error('Neon worker readiness failed: database, upload storage or media tools unavailable.');
          console.log('Neon worker database, upload storage and media tools are ready.');
          NODE
          node --env-file="$env_file" scripts/check-worker-schedule.mjs

      - name: Commit and tag release
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ACTOR_LOGIN: ${{ github.actor }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "$ACTOR_LOGIN"
          git config user.email "$ACTOR_ID+$ACTOR_LOGIN@users.noreply.github.com"
          git add package.json CHANGELOG.md src/data/release-history.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Reporter IA $TAG"
          # The workflow already ran pnpm gate; allow this controlled release push past the local main guard.
          git -c core.hooksPath=/dev/null push origin HEAD:main "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: gh release create "$TAG" --verify-tag --title "Reporter IA $TAG" --notes-file "$RELEASE_NOTES_PATH"

      - name: Record production handoff
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SUMMARY: ${{ steps.release.outputs.summary }}
        run: |
          echo "### $TAG handed to Vercel through GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "The Vercel Git integration deploys the version commit. Local Vercel users, tokens and CLI deployment are prohibited." >> "$GITHUB_STEP_SUMMARY"
