name: Controlled production deployment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate approved source
        run: pnpm gate

      - name: Calculate version and release descriptions
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: pnpm release:prepare:auto

      - name: Validate prepared release
        run: pnpm gate

      - name: Commit and tag release
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ACTOR_LOGIN: ${{ github.actor }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "$ACTOR_LOGIN"
          git config user.email "$ACTOR_ID+$ACTOR_LOGIN@users.noreply.github.com"
          git add package.json CHANGELOG.md src/data/release-history.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Reporter IA $TAG"
          git push origin HEAD:main "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/reporter-release-notes.md
        run: gh release create "$TAG" --verify-tag --title "Reporter IA $TAG" --notes-file "$RELEASE_NOTES_PATH"

      - name: Record production handoff
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SUMMARY: ${{ steps.release.outputs.summary }}
        run: |
          echo "### $TAG handed to Vercel through GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "The Vercel Git integration deploys the version commit. Local Vercel users, tokens and CLI deployment are prohibited." >> "$GITHUB_STEP_SUMMARY"
