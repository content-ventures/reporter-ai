name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated Reporter test database
        run: |
          umask 077
          printf '%s\n' \
            'REPORTER_POSTGRES_PASSWORD=ci-reporter-admin-password-0001' \
            'REPORTER_RUNTIME_PASSWORD=ci-reporter-runtime-password-0002' \
            'REPORTER_WORKER_PASSWORD=ci-reporter-worker-password-0003' \
            > .env.reporter-db

      - name: Start isolated Reporter PostgreSQL
        run: pnpm db:up

      - name: Validate branch and PR title
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/validate-branch-name.mjs "$BRANCH_NAME"
          node scripts/validate-commit-message.mjs "$PR_TITLE"

      - name: Validate commit messages and PR sizes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            exit 0
          fi
          if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            RANGE="$HEAD_SHA^..$HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          for commit in $(git rev-list --reverse "$RANGE"); do
            subject=$(git show -s --format=%s "$commit")
            node scripts/validate-commit-message.mjs "$subject"
          done
          node scripts/validate-git-identity.mjs --range "$RANGE"
          # GitHub squash-merges a reviewed PR into one commit on main. Enforce the
          # per-commit size policy while the commits still exist on the PR branch;
          # rechecking the synthetic squash commit would reject the approved PR as
          # one oversized commit even though every source commit already passed.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-change-size.mjs --range "$RANGE"
          fi

      - name: Run complete gate
        run: pnpm gate

      - name: Run backend contract tests
        run: pnpm test:backend

      - name: Run PostgreSQL integration tests
        run: pnpm db:test

      # Preserve pnpm links used by traced native packages such as Sharp. The artifact
      # action dereferences directory symlinks, which detaches Sharp from its siblings.
      - name: Archive the production build
        run: tar --exclude='.next/cache' -czf next-build.tar.gz .next

      # The smoke runs on this same production build instead of building again.
      - name: Keep the production build for the smoke
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          retention-days: 1

      - name: Stop isolated Reporter PostgreSQL
        if: always()
        run: pnpm db:stop

  smoke:
    name: Smoke e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated Reporter smoke database
        run: |
          umask 077
          printf '%s\n' \
            'REPORTER_POSTGRES_PASSWORD=ci-reporter-admin-password-0001' \
            'REPORTER_RUNTIME_PASSWORD=ci-reporter-runtime-password-0002' \
            'REPORTER_WORKER_PASSWORD=ci-reporter-worker-password-0003' \
            > .env.reporter-db

      - name: Start isolated Reporter PostgreSQL
        run: pnpm db:up

      - name: Restore the production build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract the production build
        run: tar -xzf next-build.tar.gz

      # Browsers change only with the Playwright version (pinned in the lockfile).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run connected smoke on the production build
        env:
          SMOKE_PREBUILT: "1"
        run: pnpm smoke

      - name: Build the disposable fixture regression app
        env:
          NEXT_PUBLIC_REPORTER_E2E_FIXTURES: "true"
        run: pnpm build

      - name: Run the preserved fixture regression suite
        env:
          SMOKE_PREBUILT: "1"
        run: pnpm smoke:fixtures

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7

      - name: Stop isolated Reporter PostgreSQL
        if: always()
        run: pnpm db:stop
