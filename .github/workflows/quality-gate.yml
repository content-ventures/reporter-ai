name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The controlled release runs this same gate before touching any environment.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated Reporter test database
        run: |
          umask 077
          printf '%s\n' \
            'REPORTER_POSTGRES_PASSWORD=ci-reporter-admin-password-0001' \
            'REPORTER_RUNTIME_PASSWORD=ci-reporter-runtime-password-0002' \
            'REPORTER_WORKER_PASSWORD=ci-reporter-worker-password-0003' \
            > .env.reporter-db

      - name: Start isolated Reporter PostgreSQL
        run: pnpm db:up

      - name: Validate branch and PR title
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/validate-branch-name.mjs "$BRANCH_NAME"
          node scripts/validate-commit-message.mjs "$PR_TITLE"

      - name: Validate commit messages and PR sizes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            exit 0
          fi
          if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            RANGE="$HEAD_SHA^..$HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          for commit in $(git rev-list --reverse "$RANGE"); do
            subject=$(git show -s --format=%s "$commit")
            node scripts/validate-commit-message.mjs "$subject"
          done
          node scripts/validate-git-identity.mjs --range "$RANGE"
          # Rebase preserves each reviewed change while GitHub rewrites the
          # committer metadata. Identity is verified above on both PR and main;
          # size is enforced on the source PR before merging.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-change-size.mjs --range "$RANGE"
          fi

      - name: Run complete gate
        run: pnpm gate

      - uses: ./.github/actions/build-native-media

      - name: Build the Neon ARM64 worker and validate its archive limits
        run: node scripts/check-neon-bundle.mjs

      - name: Run backend contract tests
        run: pnpm test:backend

      - name: Run PostgreSQL integration tests
        run: pnpm db:test

      # Preserve pnpm links used by traced native packages such as Sharp. The artifact
      # action dereferences directory symlinks, which detaches Sharp from its siblings.
      - name: Archive the production build
        run: tar --exclude='.next/cache' -czf next-build.tar.gz .next

      # The smoke runs on this same production build instead of building again.
      - name: Keep the production build for the smoke
        uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: next-build.tar.gz
          retention-days: 1

      - name: Stop isolated Reporter PostgreSQL
        if: always()
        run: pnpm db:stop

  rehearsal:
    name: Cloud rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/use-ubuntu-archive

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      # The production SQL, worker and media conversion against loopback storage and
      # stand-in providers: no Neon, no provider keys, no network beyond the runner.
      - name: Rehearse the cloud flow
        run: pnpm test:rehearsal

  smoke:
    name: Smoke e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated Reporter smoke database
        run: |
          umask 077
          printf '%s\n' \
            'REPORTER_POSTGRES_PASSWORD=ci-reporter-admin-password-0001' \
            'REPORTER_RUNTIME_PASSWORD=ci-reporter-runtime-password-0002' \
            'REPORTER_WORKER_PASSWORD=ci-reporter-worker-password-0003' \
            > .env.reporter-db

      - name: Start isolated Reporter PostgreSQL
        run: pnpm db:up

      - name: Restore the production build
        uses: actions/download-artifact@v7
        with:
          name: next-build

      - name: Extract the production build
        run: tar -xzf next-build.tar.gz

      - uses: ./.github/actions/use-ubuntu-archive

      # Browsers change only with the Playwright version (pinned in the lockfile).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Verify the zero-provider staging acceptance on disposable services
        run: node --conditions=react-server --import tsx --test tests/acceptance/workspace-release.rehearsal.test.ts

      - name: Run connected smoke on the production build
        env:
          SMOKE_PREBUILT: "1"
        run: pnpm smoke

      - name: Run connected workspace acceptance on the same production build
        env:
          SMOKE_PREBUILT: "1"
          SMOKE_PORT: "3003"
        run: pnpm smoke:workspaces

      - name: Build the disposable fixture regression app
        env:
          NEXT_PUBLIC_REPORTER_E2E_FIXTURES: "true"
        run: pnpm build

      - name: Run the preserved fixture regression suite
        env:
          SMOKE_PREBUILT: "1"
        run: pnpm smoke:fixtures

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7

      - name: Stop isolated Reporter PostgreSQL
        if: always()
        run: pnpm db:stop
