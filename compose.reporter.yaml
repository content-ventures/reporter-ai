      - ./database/migrations/066-editorial-memory-selected-context.sql:/docker-entrypoint-initdb.d/99-zg-editorial-memory-selected-context.sql:ro
      - ./database/migrations/067-editorial-memory-material-revisions.sql:/docker-entrypoint-initdb.d/99-zh-editorial-memory-material-revisions.sql:ro
      - ./database/migrations/068-editorial-memory-correction-impact.sql:/docker-entrypoint-initdb.d/99-zi-editorial-memory-correction-impact.sql:ro
      - ./database/migrations/069-editorial-memory-replacements.sql:/docker-entrypoint-initdb.d/99-zj-editorial-memory-replacements.sql:ro
      - ./database/migrations/070-editorial-memory-feedback.sql:/docker-entrypoint-initdb.d/99-zk-editorial-memory-feedback.sql:ro
      - ./database/migrations/071-editorial-memory-policies.sql:/docker-entrypoint-initdb.d/99-zl-editorial-memory-policies.sql:ro
      - ./database/migrations/072-editorial-memory-reassessment.sql:/docker-entrypoint-initdb.d/99-zm-editorial-memory-reassessment.sql:ro
