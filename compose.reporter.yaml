name: reporter-ai-local
services:
  postgres:
    image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
    restart: unless-stopped
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_DB: reporter_ai_local
      POSTGRES_USER: reporter_admin
      POSTGRES_PASSWORD: ${REPORTER_POSTGRES_PASSWORD:?Set REPORTER_POSTGRES_PASSWORD in .env.reporter-db}
      REPORTER_RUNTIME_PASSWORD: ${REPORTER_RUNTIME_PASSWORD:?Set REPORTER_RUNTIME_PASSWORD in .env.reporter-db}
      REPORTER_WORKER_PASSWORD: ${REPORTER_WORKER_PASSWORD:?Set REPORTER_WORKER_PASSWORD in .env.reporter-db}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${REPORTER_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/reporter-foundation.sql:/docker-entrypoint-initdb.d/00-reporter-foundation.sql:ro
      - ./database/reporter-r1.sql:/docker-entrypoint-initdb.d/10-reporter-r1.sql:ro
      - ./database/reporter-r1-commands.sql:/docker-entrypoint-initdb.d/20-reporter-r1-commands.sql:ro
      - ./database/local/30-local-seed.sql:/docker-entrypoint-initdb.d/30-local-seed.sql:ro
      - ./database/local/40-local-roles.sql:/docker-entrypoint-initdb.d/40-local-roles.sql:ro
      - ./database/migrations/003-local-flow.sql:/docker-entrypoint-initdb.d/50-local-flow.sql:ro
      - ./database/local/60-local-operator.sql:/docker-entrypoint-initdb.d/60-local-operator.sql:ro
      - ./database/migrations/004-editorial-workspace.sql:/docker-entrypoint-initdb.d/70-editorial-workspace.sql:ro
      - ./database/migrations/011-editorial-polling.sql:/docker-entrypoint-initdb.d/80-editorial-polling.sql:ro
      - ./database/migrations/012-worker-queue-status.sql:/docker-entrypoint-initdb.d/90-worker-queue-status.sql:ro
      - ./database/migrations/014-editorial-rows.sql:/docker-entrypoint-initdb.d/91-editorial-rows.sql:ro
      - ./database/migrations/015-editorial-sync.sql:/docker-entrypoint-initdb.d/92-editorial-sync.sql:ro
      - ./database/migrations/016-editorial-rows-data.sql:/docker-entrypoint-initdb.d/93-editorial-rows-data.sql:ro
    networks:
      - reporter
    healthcheck:
      test: ["CMD-SHELL", "psql -U reporter_admin -d reporter_ai_local -tAc \"SELECT to_regprocedure('public.reporter_complete(uuid,text,integer,jsonb)') IS NOT NULL AND obj_description(to_regprocedure('public.reporter_create(text,uuid,integer,text,jsonb)'),'pg_proc')='reporter-r1-v2'\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
volumes:
  postgres_data: {}
networks:
  reporter: {}
